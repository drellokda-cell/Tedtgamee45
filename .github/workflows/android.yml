name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare web files
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Lock app to landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = 'android:name=".MainActivity"'
          if marker not in s:
              raise SystemExit('Could not find MainActivity in AndroidManifest.xml')
          before, after = s.split(marker, 1)
          if 'android:screenOrientation=' not in before[-400:]:
              before += ''
              after = after
              # Add the attribute directly to MainActivity, without changing other activities.
              s = before + marker + ' android:screenOrientation="landscape"' + after
          else:
              import re
              s = re.sub(r'(android:name="\.MainActivity"[^>]*?)android:screenOrientation="[^"]*"', r'\1android:screenOrientation="landscape"', s, count=1)
          p.write_text(s)
          PY
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soon-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
